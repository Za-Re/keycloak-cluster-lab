---
- name: Base system (updates, time, SSH, firewall)
  hosts: all
  become: true
  roles:
    - common

- name: PKI (certificates for every host)
  hosts: all
  become: true
  roles:
    - pki

- name: Database (PostgreSQL for Keycloak)
  hosts: database
  become: true
  roles:
    - postgresql

- name: Keycloak nodes
  hosts: keycloak
  become: true
  roles:
    - keycloak

- name: Load balancer (HAProxy in front of Keycloak)
  hosts: loadbalancer
  become: true
  roles:
    - haproxy
