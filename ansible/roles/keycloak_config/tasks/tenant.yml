---
# Everything for ONE tenant realm. Included once per entry in keycloak_config_tenants;
# the login comes from module_defaults in main.yml.
- name: "Realm and its security settings | {{ tenant }}"
  community.general.keycloak_realm:
    realm: "{{ tenant }}"
    id: "{{ tenant }}"
    enabled: true
    # HTTPS for every request, even from private IPs (default "external" allows HTTP there).
    ssl_required: all
    registration_allowed: false
    brute_force_protected: true
    password_policy: "{{ keycloak_config_password_policy }}"
    access_token_lifespan: "{{ keycloak_config_access_token_lifespan }}"
    # Refresh token rotation: each refresh token works once; reusing it fails
    # (a stolen, already-used token is detected).
    revoke_refresh_token: true
    refresh_token_max_reuse: 0
    # Login events (logins, failures) and admin events (config changes), auto-deleted.
    # Admin event "details" stay off: they can contain secrets.
    events_enabled: true
    events_expiration: "{{ keycloak_config_events_expiration }}"
    admin_events_enabled: true
    admin_events_details_enabled: false
    attributes:
      # No module option for this; realm attribute name from Keycloak's RealmAttributes.java.
      adminEventsExpiration: "{{ keycloak_config_events_expiration | string }}"
    state: present
  no_log: true

# The role that hello-app checks (REQUIRED_ROLE=hello-reader).
- name: "Realm role hello-reader | {{ tenant }}"
  community.general.keycloak_role:
    realm: "{{ tenant }}"
    name: hello-reader
    description: May use the hello-app
    state: present
  no_log: true

# Test user. First/last name filled so the first login doesn't stop at
# "update your profile"
- name: "Test user demo-user | {{ tenant }}"
  community.general.keycloak_user:
    realm: "{{ tenant }}"
    username: demo-user
    email: user.demo@example.com
    email_verified: true
    first_name: Demo
    last_name: User
    enabled: true
    credentials:
      - type: password
        value: "{{ vault_kc_test_user_password }}"
        temporary: false
    state: present
  no_log: true

- name: "Grant hello-reader to demo-user | {{ tenant }}"
  community.general.keycloak_user_rolemapping:
    realm: "{{ tenant }}"
    target_username: demo-user
    roles:
      - name: hello-reader
    state: present
  no_log: true

# hello-app's client (has a secret, the app runs server-side).
- name: "Client fastapi-app | {{ tenant }}"
  community.general.keycloak_client:
    realm: "{{ tenant }}"
    client_id: fastapi-app
    enabled: true
    public_client: false
    client_authenticator_type: client-secret
    secret: "{{ vault_kc_fastapi_client_secret }}"
    # Browser login (authorization code) only: no password grant, no implicit,
    # no service account.
    standard_flow_enabled: true
    direct_access_grants_enabled: false
    implicit_flow_enabled: false
    service_accounts_enabled: false
    # Exact URIs, no wildcards: Keycloak only redirects back to these.
    redirect_uris:
      - http://localhost:8000/callback
    attributes:
      post.logout.redirect.uris: http://localhost:8000/
      # Reject any authorization request without a S256 PKCE challenge.
      pkce.code.challenge.method: S256
    # Off: tokens carry only roles explicitly allowed below, not every role the user has.
    full_scope_allowed: false
    protocol_mappers:
      # Tells the app which tenant (realm) the user logged in to.
      - name: tenant
        protocol: openid-connect
        protocolMapper: oidc-hardcoded-claim-mapper
        config:
          claim.name: tenant
          claim.value: "{{ tenant }}"
          jsonType.label: String
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
    state: present
  no_log: true

# With full scope off, this is the only realm role that can appear in its tokens.
- name: "Limit fastapi-app tokens to hello-reader | {{ tenant }}"
  community.general.keycloak_client_rolescope:
    realm: "{{ tenant }}"
    client_id: fastapi-app
    role_names:
      - hello-reader
    state: present
  no_log: true
