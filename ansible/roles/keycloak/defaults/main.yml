---
keycloak_version: 26.8.2
# JRE (run only, no compiler), headless (no GUI libs). Same Java major as the
# official Keycloak container image.
keycloak_java_package: openjdk-21-jre-headless

keycloak_user: keycloak
# One folder per version; /opt/keycloak points at the active one
keycloak_install_dir: "/opt/keycloak-{{ keycloak_version }}"
keycloak_home: /opt/keycloak

keycloak_download_url: "https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz"
# Digest from the GitHub release metadata; the tarball's .asc signature was checked
# once against keycloak.org/keys (key 861AB50E...). Update with keycloak_version.
keycloak_sha256: dd124787283918bc597628887168333465ee2a811a389e0003569e52be7e487f

keycloak_https_port: 8443
keycloak_management_port: 9000
# jdbc-ping: 7800 data, 57800 failure detection (keycloak.org/server/caching)
keycloak_cluster_ports: [7800, 57800]

# On stop, report "not ready" this long while still serving, so the load balancer
# drops the node first. Must exceed HAProxy's detection time (inter 5s x fall 3 = 15s).
keycloak_shutdown_delay: 18s

# Temporary admin for the first start; roles/keycloak_config replaces and deletes it.
keycloak_bootstrap_admin_user: temp-admin
keycloak_bootstrap_env: /etc/keycloak/bootstrap.env
keycloak_bootstrap_marker: /etc/keycloak/.bootstrap-done

# Build-time options (list: kc.sh build --help). Changing these triggers a rebuild.
keycloak_build_options:
  db: postgres
  health-enabled: "true"
  metrics-enabled: "true"
# Name changes with the version or build options -> "kc.sh build" runs again.
keycloak_build_stamp: "{{ keycloak_install_dir }}/.built-{{ (keycloak_version ~ (keycloak_build_options | to_json)) | hash('sha256') }}"
