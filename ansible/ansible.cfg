[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# Collections are installed into the project so the pins in requirements.yml
# win over whatever the OS "ansible" package bundles.
collections_path = ./collections
vault_password_file = .vault_pass
remote_user = vagrant
private_key_file = ~/.ssh/keycloak-lab_ed25519
interpreter_python = auto_silent
stdout_callback = yaml  # It makes Ansible's output easier to read

[ssh_connection]
# Lab VMs get new host keys on every rebuild. Keep them in a project-local
# known_hosts file (trust on first use) instead of disabling host key checks;
# `rm .known_hosts` after `vagrant destroy`.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=.known_hosts -o StrictHostKeyChecking=accept-new
pipelining = True
