---
# Ansible log in as its own client, ansible-admin.
# On the very first run that client doesn't exist yet, so we fall back to the
# temporary bootstrap admin, just long enough to create it.
- name: Can ansible-admin log in yet?
  ansible.builtin.uri:
    url: "{{ keycloak_config_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ keycloak_config_client_id }}"
      client_secret: "{{ vault_kc_ansible_client_secret }}"
    ca_path: "{{ pki_remote_dir }}/ca.crt"
    # 401 = client unknown (first run); anything else is a real error.
    # a WRONG secret also gives 401, so it falls back to temp-admin.
    # Once temp-admin is deleted, a "temp-admin login failed" error usually means
    # vault_kc_ansible_client_secret doesn't match. Add a clear check if required.
    status_code: [200, 401]
  register: keycloak_config_login
  no_log: true

# Since 26.8.2 the admin API rejects tokens without kc-admin-api scope (401).
- name: Does the admin API accept that token?
  ansible.builtin.uri:
    url: "{{ keycloak_config_url }}/admin/realms/master"
    headers:
      Authorization: "Bearer {{ keycloak_config_login.json.access_token }}"
    ca_path: "{{ pki_remote_dir }}/ca.crt"
    status_code: [200, 401]
  register: keycloak_config_admin_check
  when: keycloak_config_login.status == 200
  no_log: true

- name: Remember which login to use
  ansible.builtin.set_fact:
    keycloak_config_use_client: "{{ keycloak_config_admin_check.status | default(0) == 200 }}"

# module_defaults: these login settings apply to every keycloak_* module in the
# block, so each task only says what to configure. omit = parameter not sent.
- name: Configure Keycloak through its admin API
  module_defaults:
    group/community.general.keycloak:
      auth_keycloak_url: "{{ keycloak_config_url }}"
      auth_realm: master
      auth_client_id: "{{ keycloak_config_use_client | ternary(keycloak_config_client_id, 'admin-cli') }}"
      auth_client_secret: "{{ keycloak_config_use_client | ternary(vault_kc_ansible_client_secret, omit) }}"
      auth_username: "{{ keycloak_config_use_client | ternary(omit, keycloak_bootstrap_admin_user) }}"
      auth_password: "{{ keycloak_config_use_client | ternary(omit, vault_kc_bootstrap_admin_password) }}"
  block:
    # Service account only: no browser login, no password grant.
    - name: master | ansible-admin client (Ansible's service account)
      community.general.keycloak_client:
        realm: master
        client_id: "{{ keycloak_config_client_id }}"
        public_client: false
        client_authenticator_type: client-secret
        secret: "{{ vault_kc_ansible_client_secret }}"
        service_accounts_enabled: true
        standard_flow_enabled: false
        implicit_flow_enabled: false
        direct_access_grants_enabled: false
        # Required since 26.8.2: puts the admin API audience into the token.
        # patch = add it, keep the scopes Keycloak gave the client by default.
        default_client_scopes:
          - kc-admin-api
        client_scopes_behavior: patch
        state: present
      no_log: true

    # Realm role "admin" in master = may manage all realms.
    - name: master | ansible-admin may administer Keycloak
      community.general.keycloak_user_rolemapping:
        realm: master
        service_account_user_client_id: "{{ keycloak_config_client_id }}"
        roles:
          - name: admin
        state: present
      no_log: true

    # Lock accounts after repeated failed logins (Keycloak's default thresholds).
    - name: master | brute-force protection
      community.general.keycloak_realm:
        realm: master
        brute_force_protected: true
        state: present
      no_log: true

    # Human admin. CONFIGURE_TOTP: first browser login forces setting up an
    # authenticator app, so this account always has MFA.
    # The password is only sent when the user is created or updated; changing it
    # in the vault later does not change it in Keycloak.
    - name: master | permanent admin user
      community.general.keycloak_user:
        realm: master
        username: "{{ keycloak_config_admin_user }}"
        enabled: true
        credentials:
          - type: password
            value: "{{ vault_kc_admin_password }}"
            temporary: false
        required_actions:
          - CONFIGURE_TOTP
        state: present
      no_log: true

    - name: master | permanent admin has the admin role
      community.general.keycloak_user_rolemapping:
        realm: master
        target_username: "{{ keycloak_config_admin_user }}"
        roles:
          - name: admin
        state: present
      no_log: true

    # Tasks inside the included file inherit this block's module_defaults (login).
    - name: Tenant realms
      ansible.builtin.include_tasks: tenant.yml
      loop: "{{ keycloak_config_tenants }}"
      loop_control:
        loop_var: tenant

    # KEEP LAST: on a first run every task above logs in as temp-admin.
    # roles/keycloak's marker file stops it from being recreated.
    - name: master | delete the temporary bootstrap admin
      community.general.keycloak_user:
        realm: master
        username: "{{ keycloak_bootstrap_admin_user }}"
        state: absent
      no_log: true
